assemble:
    -   fromTask: bootJar
liferay-forumsmicroservice-oauth-application-user-agent:
    .serviceAddress: localhost:58082
    .serviceScheme: http
    name: ForumsMicroservice OAuth Application User Agent
    scopes:
        -   Liferay.Headless.Admin.User.everything
        -   Liferay.Headless.Object.everything
        -   c_forumthread.everything
        -   c_forummessage.everything
        -   c_forumsubscription.everything
        -   c_forumnotification.everything
        -   Liferay.Headless.Admin.Site.everything
        -   Liferay.Object.Admin.REST.everything
    type: oAuthApplicationUserAgent
liferay-forumsmicroservice-object-action-new-reply:
    name: ForumsMicroservice Object Action New Reply
    oAuth2ApplicationExternalReferenceCode: liferay-forumsmicroservice-oauth-application-user-agent
    resourcePath: /object-action/new-reply
    type: objectAction
liferay-forumsmicroservice-object-action-updated-reply:
    name: ForumsMicroservice Object Action Updated Reply
    oAuth2ApplicationExternalReferenceCode: liferay-forumsmicroservice-oauth-application-user-agent
    resourcePath: /object-action/updated-reply
    type: objectAction
